<svg width="700" height="300" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg"><rect width="700" height="300" rx="16" fill="#06060f"/><defs><radialGradient id="rb0" cx="35%" cy="35%"><stop offset="0%" stop-color="#67e8f9" stop-opacity="0.28"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/></radialGradient><radialGradient id="rb1" cx="35%" cy="35%"><stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.28"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/></radialGradient><radialGradient id="rb2" cx="35%" cy="35%"><stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.28"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0.1"/></radialGradient><radialGradient id="rb3" cx="35%" cy="35%"><stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.28"/><stop offset="100%" stop-color="#10b981" stop-opacity="0.1"/></radialGradient></defs><text x="20" y="18" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#334155" letter-spacing="0.1em">KEY STATS</text><circle cx="148" cy="108" r="70" fill="url(#rb0)" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.7"/><text x="148" y="115" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="22" font-weight="900" fill="#67e8f9" text-anchor="middle">2.25MB</text><text x="148" y="193" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">Raw RGB size</text><text x="148" y="205" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="9" fill="#334155" text-anchor="middle">for that same image</text><circle cx="368" cy="86" r="64" fill="url(#rb1)" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.7"/><text x="368" y="93" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="22" font-weight="900" fill="#c4b5fd" text-anchor="middle">786K</text><text x="368" y="165" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">Pixels</text><text x="368" y="177" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="9" fill="#334155" text-anchor="middle">in a 1024x768 image</text><circle cx="568" cy="124" r="58" fill="url(#rb2)" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.7"/><text x="568" y="131" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="22" font-weight="900" fill="#a5b4fc" text-anchor="middle">256</text><text x="568" y="197" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">Gray levels</text><text x="568" y="209" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="9" fill="#334155" text-anchor="middle">in an 8-bit pixel</text><circle cx="272" cy="214" r="51" fill="url(#rb3)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.7"/><text x="272" y="221" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="22" font-weight="900" fill="#6ee7b7" text-anchor="middle">1960s</text><text x="272" y="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">Image processing begins</text><text x="272" y="292" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="9" fill="#334155" text-anchor="middle">MIT and Stanford</text></svg>